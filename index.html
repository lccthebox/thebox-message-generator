<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>더박스 도구 모음</title>

<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#111827;
  --shadow:0 10px 30px rgba(17,24,39,.06);
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic", sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:1200px;margin:22px auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:30px;margin:0}
.tabs{display:flex;gap:8px}
.tabbtn{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 14px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}
.tabbtn.active{background:var(--accent);color:#fff}
.panel{display:none}
.panel.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}
.form{
  display:grid;
  grid-template-columns:140px 1fr;
  gap:10px 12px;
}
.label{font-size:13px;color:var(--muted)}
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
}
.preview{
  white-space:pre-wrap;
  font-family:monospace;
  font-size:13px;
  min-height:420px;
}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  font-weight:800;
  cursor:pointer;
}
.btn.primary{background:var(--accent);color:#fff}
</style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">
      <h1>더박스 도구 모음</h1>
    </div>
    <div class="tabs">
      <button class="tabbtn active" data-tab="vod">인강 환불</button>
    </div>
  </div>

<section id="tab-vod" class="panel active">
<div class="grid">
<div class="card">
<h2>인강 환불 계산기</h2>

<div class="form">
<div class="label">실결제금액</div>
<input id="paid" type="number">

<div class="label">강의 정가</div>
<input id="listPrice" type="number">

<div class="label">결제일</div>
<input id="payDate" type="date">

<div class="label">환불요청일</div>
<input id="reqDate" type="date">

<div class="label">제공기간(일)</div>
<input id="totalDays" type="number">

<div class="label">전체 차시</div>
<input id="totalLect" type="number">

<div class="label">수강 차시</div>
<input id="usedLect" type="number">
</div>

<div class="btnrow">
<button class="btn primary" id="calc">계산</button>
<button class="btn" id="reset">초기화</button>
</div>
</div>

<div class="card">
<h3>결과</h3>
<pre id="out" class="preview"></pre>
</div>
</div>
</section>
</div>

<script>
const $ = id => document.getElementById(id);
const money = n => Math.round(n).toLocaleString('ko-KR');

function diffDays(a,b){
  return Math.floor((new Date(b)-new Date(a))/(1000*60*60*24));
}

function calc(){
  const paid = +$('paid').value;
  const list = +$('listPrice').value;
  const totalLect = +$('totalLect').value;
  const usedLect = Math.min(+$('usedLect').value, totalLect);
  const totalDays = +$('totalDays').value;
  const payDate = $('payDate').value;
  const reqDate = $('reqDate').value;

  if(!paid||!list||!totalLect||!payDate||!reqDate||!totalDays){
    $('out').textContent='입력값을 모두 입력해주세요.';
    return;
  }

  const d = diffDays(payDate,reqDate);
  const within7 = d<=7;
  const halfPassed = d/totalDays>0.5;

  if(halfPassed){
    $('out').textContent='[환불 불가]\n전체 제공기간의 1/2 경과';
    return;
  }

  const studyFee = usedLect>0 ? Math.round(list*(usedLect/totalLect)) : 0;
  const penalty = within7 ? 0 : Math.round(paid*0.1);

  let refund=0;
  let rule='';

  if(usedLect===0){
    refund = within7 ? paid : paid-penalty;
    rule = within7?'미수강 + 7일 이내':'미수강 + 7일 이후';
  }else{
    refund = within7 ? paid-studyFee : paid-studyFee-penalty;
    rule = within7?'수강중 + 7일 이내':'수강중 + 7일 이후';
  }

  refund = Math.max(0,refund);

  $('out').textContent=
`[인강 환불 계산 결과]
- 결제일로부터: ${d}일
- 7일 이내 여부: ${within7?'이내':'이후'}
- 수강 상태: ${usedLect===0?'미수강':'수강중'}
- 학습수수료: ${money(studyFee)}원
- 위약금: ${money(penalty)}원
- 적용 규칙: ${rule}
--------------------
최종 환불금액: ${money(refund)}원`;
}

$('calc').onclick=calc;
$('reset').onclick=()=>{
  ['paid','listPrice','totalLect','usedLect','totalDays'].forEach(id=>$(id).value='');
  ['payDate','reqDate'].forEach(id=>$(id).value='');
  $('out').textContent='';
};
</script>
</body>
</html>
