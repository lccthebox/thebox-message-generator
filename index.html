<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>더박스 메시지 생성기</title>
  <style>
    :root { --gap:16px; --bd:#e5e7eb; --bg:#f8fafc; }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif;background:var(--bg);color:#111827}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    .grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:var(--gap)}
    .card{background:white;border:1px solid var(--bd);border-radius:12px;padding:16px}
    h1{font-size:18px;margin:0 0 12px}
    h2{font-size:14px;margin:18px 0 10px}
    .row{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;margin:8px 0}
    label{font-size:13px;color:#374151}
    input[type="text"], input[type="date"], input[type="number"], textarea, select{
      width:100%;padding:10px 10px;border:1px solid var(--bd);border-radius:10px;background:#fff;
      font-size:14px;
    }
    textarea{min-height:110px;resize:vertical}
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:999px;padding:8px 10px;background:#fff}
    .chip input{transform:translateY(1px)}
    .inline{display:flex;gap:10px;flex-wrap:wrap}
    .inline .chip{padding:6px 10px}
    .muted{font-size:12px;color:#6b7280;line-height:1.4}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{
      border:1px solid var(--bd);background:#111827;color:white;border-radius:10px;padding:10px 14px;
      font-size:14px;cursor:pointer
    }
    button.secondary{background:white;color:#111827}
    pre{
      margin:0;white-space:pre-wrap;word-break:break-word;
      border:1px solid var(--bd);border-radius:12px;padding:14px;background:#fff;min-height:480px;
      font-size:14px;line-height:1.55
    }
    .badge{display:inline-block;font-size:12px;color:#111827;background:#eef2ff;border:1px solid #e0e7ff;padding:4px 8px;border-radius:999px}
    @media (max-width: 980px){ .grid{grid-template-columns:1fr} pre{min-height:320px} }
  </style>
</head>
<body>
<div class="wrap">
  <h1>더박스 메시지 생성기 <span class="badge">템플릿 + 체크 + 빈칸</span></h1>

  <div class="grid">
    <div class="card">
      <h2>1) 종류 선택</h2>
      <div id="typeRadios" class="chips"></div>

      <h2>2) 포함할 섹션</h2>
      <div id="sectionChecks" class="chips"></div>
      <div class="muted">종류를 고르면 기본 체크 상태가 자동으로 바뀝니다. (종류에 따라 일부 섹션은 숨겨집니다)</div>

      <h2>3) 입력(빈칸)</h2>
      <div id="fields"></div>

      <div class="actions">
        <button id="copyBtn">결과 복사</button>
        <button id="resetBtn" class="secondary">초기화</button>
        <button id="fillDemoBtn" class="secondary">데모값 채우기</button>
      </div>
    </div>

    <div class="card">
      <h2>생성 문장 (미리보기)</h2>
      <pre id="output"></pre>
      <div class="muted" style="margin-top:10px">
        규칙: 선택된 블록을 순서대로 붙이고, {변수}를 입력값으로 치환합니다. 입력이 비어있으면 해당 줄은 자동 제거됩니다.
      </div>
    </div>
  </div>
</div>

/**
 * =========================
 * STATE
 * =========================
 */
const state = {
  typeId: CONFIG.types[0].id,
  sectionsOn: new Set(CONFIG.types[0].defaultSections),
  values: {},
};
function currentType(){ return CONFIG.types.find(t => t.id === state.typeId); }

/**
 * =========================
 * UI
 * =========================
 */
const $typeRadios = document.getElementById("typeRadios");
const $sectionChecks = document.getElementById("sectionChecks");
const $fields = document.getElementById("fields");
const $output = document.getElementById("output");

function renderTypes(){
  $typeRadios.innerHTML = "";
  CONFIG.types.forEach(t => {
    const el = document.createElement("label");
    el.className = "chip";
    el.innerHTML = `<input type="radio" name="type" value="${t.id}" ${t.id===state.typeId?"checked":""}/>
                    <span>${t.label}</span>`;
    el.querySelector("input").addEventListener("change", () => {
      state.typeId = t.id;
      state.sectionsOn = new Set(t.defaultSections);
      renderSections();
      renderFields();
      updateOutput();
    });
    $typeRadios.appendChild(el);
  });
}

function renderSections(){
  $sectionChecks.innerHTML = "";
  const t = currentType();
  const allowed = new Set(t.allowedSections || CONFIG.sections.map(s => s.id));

  CONFIG.sections.forEach(s => {
    if(!allowed.has(s.id)) return;

    const el = document.createElement("label");
    el.className = "chip";
    const checked = state.sectionsOn.has(s.id) ? "checked" : "";
    el.innerHTML = `<input type="checkbox" value="${s.id}" ${checked}/>
                    <span>${s.label}</span>`;
    el.querySelector("input").addEventListener("change", (e) => {
      if(e.target.checked) state.sectionsOn.add(s.id);
      else state.sectionsOn.delete(s.id);
      renderFields();
      updateOutput();
    });
    $sectionChecks.appendChild(el);
  });
}

function fieldVisible(field){
  if(field.group && !state.sectionsOn.has(field.group)) return false;
  if(field.showIf){
    const cur = (state.values[field.showIf.field] ?? "");
    if(cur !== field.showIf.equals) return false;
  }
  return true;
}

function renderFields(){
  $fields.innerHTML = "";
  const visibleFields = CONFIG.fields.filter(fieldVisible);
  if(visibleFields.length === 0){
    const p = document.createElement("div");
    p.className = "muted";
    p.textContent = "선택된 섹션에 입력할 항목이 없습니다.";
    $fields.appendChild(p);
    return;
  }

  visibleFields.forEach(f => {
    const row = document.createElement("div");
    row.className = "row";

    const lab = document.createElement("label");
    lab.textContent = f.label;

    const ctrlWrap = document.createElement("div");

    let ctrl;
    if(f.type === "select"){
      ctrl = document.createElement("select");
      const opts = f.optionsKey ? CONFIG.options[f.optionsKey] : f.options;
      opts.forEach(o=>{
        const opt = document.createElement("option");
        opt.value = o; opt.textContent = o;
        ctrl.appendChild(opt);
      });
      ctrl.value = state.values[f.id] ?? (opts[0] ?? "");

      // 위치는 수강명 매핑이면 잠금(상담톡은 6층 고정)
      if(f.id === "location"){
        const coursePicked = (state.values.courseName || "").trim();
        const mappedLoc = CONFIG.courseToLocation[coursePicked];
        const lock = (state.typeId === "consultTalk") || (!!mappedLoc && coursePicked !== "기타(직접입력)");
        if(lock){
          ctrl.value = (state.typeId === "consultTalk") ? "6층 (상담/로비)" : mappedLoc;
          state.values.location = ctrl.value;
          ctrl.disabled = true;
        } else {
          ctrl.disabled = false;
        }
      }

    } else if(f.type === "multicheck"){
      ctrl = document.createElement("div");
      ctrl.className = "inline";
      const opts = CONFIG.options[f.optionsKey] || f.options || [];
      const selected = new Set((state.values[f.id] || "").split("|").filter(Boolean));
      opts.forEach(o=>{
        const chip = document.createElement("label");
        chip.className = "chip";
        chip.innerHTML = `<input type="checkbox" value="${o}" ${selected.has(o)?"checked":""}/><span>${o}</span>`;
        chip.querySelector("input").addEventListener("change", () => {
          const now = new Set((state.values[f.id] || "").split("|").filter(Boolean));
          if(chip.querySelector("input").checked) now.add(o); else now.delete(o);
          state.values[f.id] = Array.from(now).join("|");
          updateOutput();
        });
        ctrl.appendChild(chip);
      });
    } else {
      ctrl = document.createElement("input");
      ctrl.type = (f.type === "number") ? "number" : "text";
      if(f.min != null) ctrl.min = f.min;
      if(f.max != null) ctrl.max = f.max;
      ctrl.placeholder = f.placeholder || "";
      ctrl.value = state.values[f.id] ?? "";
    }

    if(f.type !== "multicheck"){
      ctrl.addEventListener("input", () => {
        state.values[f.id] = ctrl.value;

        // 수강명 바뀌면 위치 자동 갱신(매핑이면 강제)
        if(f.id === "courseName"){
          const picked = (state.values.courseName || "").trim();
          const mapped = CONFIG.courseToLocation[picked];
          if(mapped && picked !== "기타(직접입력)"){
            state.values.location = mapped;
          }
          renderFields();
        }

        updateOutput();
      });
      ctrl.addEventListener("change", () => {
        state.values[f.id] = ctrl.value;

        if(f.id === "courseName"){
          const picked = (state.values.courseName || "").trim();
          const mapped = CONFIG.courseToLocation[picked];
          if(mapped && picked !== "기타(직접입력)"){
            state.values.location = mapped;
          }
          renderFields();
        }

        updateOutput();
      });
    }

    row.appendChild(lab);
    ctrlWrap.appendChild(ctrl);
    row.appendChild(ctrlWrap);
    $fields.appendChild(row);
  });
}

/**
 * =========================
 * GENERATION
 * =========================
 */
function buildVars(){
  const v = {...state.values};

  // 수강명 확정(기타면 직접입력)
  const coursePicked = (v.courseName || "").trim();
  if(coursePicked === "기타(직접입력)"){
    v.courseName = (v.courseNameCustom || "").trim();
  }

  // 수강명→위치 자동
  const mappedLoc = CONFIG.courseToLocation[coursePicked];
  const isCourseMapped = !!mappedLoc;

  if(state.typeId === "consultTalk"){
    v.location = "6층 (상담/로비)";
  } else {
    if(isCourseMapped && coursePicked !== "기타(직접입력)") v.location = mappedLoc;
  }

  // 고정값
  v.bank = CONFIG.meta.bank;
  v.cafe = CONFIG.meta.cafe;
  v.schedule = CONFIG.meta.schedule;
  v.address = CONFIG.meta.address;

  // 분 표현
  const minute = (v.minute || "").trim();
  v.minuteLine = minute ? ` ${minute}분` : "";

  // 결제 라인
  v.amountLine = (v.amount || "").trim();
  const paySet = (v.payMethods || "").split("|").filter(Boolean);
  v.payMethodLine = paySet.length ? paySet.join(", ") : "";

  v.payLinkPhone = (v.payLinkPhone || "").trim();
  v.cashNumber = (v.cashNumber || "").trim();

  return v;
}

function applyTemplate(str, vars){
  let out = str.replace(/\{([a-zA-Z0-9_]+)\}/g, (_, key) => (vars[key] ?? "").toString());

  // 빈 괄호 제거
  out = out.replace(/\(\s*\)/g, "");

  // 값 없는 라인 제거
  out = out.split("\n").filter(line => {
    const trimmed = line.trim();
    if(trimmed === "") return true;
    if(/:\s*$/.test(trimmed)) return false;
    if(/-\s*[^:]+:\s*$/.test(trimmed)) return false;
    return true;
  }).join("\n");

  // 연속 빈줄 정리
  out = out.replace(/\n{3,}/g, "\n\n");

  return out.trim() + "\n";
}

function activeBlocksForType(){
  const t = currentType();
  const on = state.sectionsOn;

  const map = {
    enrollBlock: "enroll",
    paymentBlock: "payment",
    discountBlock: "discount",
    etcBlock: "etc",
    consultBlock: "consult",
    certBlock: "cert",
    cashBlock: "cash",
  };

  return t.order.filter(blockId => {
    const needed = map[blockId];
    if(!needed) return true;
    return on.has(needed);
  });
}

function updateOutput(){
  const vars = buildVars();
  const blocks = activeBlocksForType();
  const parts = blocks.map(id => applyTemplate(CONFIG.blocks[id] || "", vars));
  let text = parts.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
  $output.textContent = text;
}

  const text = $output.textContent;
  try{
    await navigator.clipboard.writeText(text);
    alert("복사 완료");
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    alert("복사 완료");
  }
});
